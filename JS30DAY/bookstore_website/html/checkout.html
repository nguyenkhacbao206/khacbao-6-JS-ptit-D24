<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>
    <link rel="stylesheet" href="../assets/css/checkout.css">
    <link rel="stylesheet" href="../html/fontawesome/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-content">
                <div class="content-contact">
                    <div class="contact-fb">
                        <i class="fa-brands fa-facebook-f"></i>7500k Followers
                    </div>
                    <div class="contact-phone">
                        <i class="fa-solid fa-phone"></i>+84 919 844 118
                    </div>
                </div>
                <div class="content-icon">
                    <div class="content-title">
                        <p>30%</p>
                        <span>Discount For The First Order!</span>
                    </div>
                    <div class="content-ic">
                        <i class="fa-brands fa-facebook-f"></i>
                        <i class="fa-brands fa-twitter"></i>
                        <i class="fa-brands fa-instagram"></i>
                        <i class="fa-brands fa-vimeo-v"></i>
                    </div>
                </div>
            </div>
            <div class="header-nav">
                <div class="logo">
                <h2>BookStore</h2>
                </div>
                <nav>
                    <ul>
                        <li><a href="../html/index.html">Trang chủ</a></li>
                        <li><a href="../html/books.html">Sách</a></li>
                        <!-- <li><a href="#">Thể loại</a></li> -->
                        <li><a href="../html/about.html">Giới thiệu</a></li>
                        <li><a href="../html/contact.html">Liên hệ</a></li>
                    </ul>
                </nav>
                <div class="icon">
                    <div class="login" id="authLinks">
                        <a href="../html/reg.html">Đăng ký</a> |
                        <a href="../html/login.html">Đăng nhập</a>
                    </div>
                    <div id="greentingSection">
                        Xin chào: <span id="userFullName"></span> |
                        <a href="#" id="logoutbtn">Đăng xuất</a>
                    </div>
                    <div class="icon-shopping">
                        <a href="../html/shopping.html"><i class="fa-solid fa-cart-shopping"></i></a>

                    </div>
                    <div class="icon-search">
                        <a href="../html/history.html"><i class="fa-solid fa-file-invoice"></i></a>
                    </div>
                </div>
                </div>
        </div>
    </header>
    <main>
        <div class="checkout-container">
            <h2>Xác nhận đơn hàng</h2>

            <!-- Thông tin giỏ hàng -->
            <div id="checkout-summary">
                <!-- Các sản phẩm sẽ được render ở đây bằng JS -->
            </div>

            <!-- Thông tin người nhận -->
            <form id="checkout-form">
                <h3>Thông tin thanh toán</h3>
                <input type="text" id="fullname" placeholder="Họ và tên" required>
                <input type="tel" id="phone" placeholder="Số điện thoại" required>
                <input type="email" id="email" placeholder="Email" required>

                <!-- <label for="payment-method">Phương thức thanh toán:</label> -->
                <select id="payment-method" required>
                    <option value="">-- Chọn phương thức --</option>
                    <option value="cod">Thanh toán khi nhận hàng (COD)</option>
                    <option value="bank">Chuyển khoản ngân hàng</option>
                    <option value="momo">Ví Momo</option>
                </select>

                <!-- QR Chuyển khoản -->
                <div id="qr-bank" class="qr-box" style="display: none;">
                    <p>Quét mã QR để chuyển khoản ngân hàng:</p>
                    <img src="../assets/images/qrcodebank.jpg" alt="QR ngân hàng" width="200">
                </div>

                <!-- QR Momo -->
                <div id="qr-momo" class="qr-box" style="display: none;">
                    <p>Quét mã QR để thanh toán bằng ví Momo:</p>
                    <img src="path/to/momo-qr.png" alt="QR Momo" width="200">
                </div>

                <button type="submit">Xác nhận thanh toán</button>
            </form>
        </div>
    </main>
    <script src="../js/checkout.js"></script>
    <script src="../js/authlink.js"></script>
</body>
</html>
