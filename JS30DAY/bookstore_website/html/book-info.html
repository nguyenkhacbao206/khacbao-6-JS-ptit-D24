<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chi tiết sách</title>
  <link rel="stylesheet" href="../html/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/book-info.css">
   
</head>
<body>
  <button class="back-button" onclick="window.history.back()">← Quay về</button>
  <div class="book-info-container">
    <img id="book-image" src="" alt="Ảnh sách" />
    <div class="book-info-details">
      <h1 id="book-title">Tiêu đề sách</h1>
      <p id="book-author">Tác giả: ...</p>
      <p class="price" id="book-price">Giá: ...</p>
      <p class="rating" id="book-rating">Đánh giá: ⭐⭐⭐⭐</p>
      <p id="book-description">Mô tả: Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    </div>
  </div>
  
  
  <script src="../js/book-info.js"></script>
</body>
</html>
